name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          node sync-assets.js
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bu-smart-bus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: BU Smart Bus Latest Android APK
          body: |
            ## 🚍 BU Smart Bus Tracker - Latest Android App (.APK)
            Official Android APK build for University of Barishal Smart Bus Live GPS Tracker.
            
            - **Real-time Live GPS Tracking**
            - **Background Location Service Support**
            - **Student Live Route & ETA Calculator**
            - **Driver Cockpit & Simulator**
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
