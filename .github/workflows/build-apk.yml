name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Sync Web Assets to www
        run: node sync-assets.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bu-smart-bus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: BU Bus Tracker Android APK v1.0.6 (Clean UI Update)
          overwrite: true
          body: |
            ## 🚍 BU Bus Tracker v1.0.6 - Clean UI & Performance Update
            Official Android APK build for University of Barishal Bus Tracking System.
            
            ### ✨ What's New in v1.0.6:
            - 🎯 Removed manual GPS popup card and toggle button from live map.
            - 🗺️ Compact sleek pill for Google Maps link without obscuring map view.
            - 📱 Cleaned up in-app install promo cards from student view and bottom navigation.
            - 🔍 Fixed Leaflet zoom (+ / -) controls positioning so they sit cleanly above the bottom bar.
            - 🏷️ Updated branding to **BU Bus Tracker — University of Barishal**.
            - 🚍 Preserved all core driver & student real-time WebSocket/GPS tracking logic.
            
            - **Real-time Live GPS Tracking**
            - **Background Location Service Support**
            - **Student Live Route & ETA Calculator**
            - **Driver Cockpit & Simulator**
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
