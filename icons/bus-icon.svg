<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="16 10" opacity="0.4" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.3" />

  <!-- GPS Pin / Radar Glow Top -->
  <circle cx="256" cy="115" r="16" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="115" r="7" fill="#ffffff" />

  <!-- Bus Body -->
  <rect x="126" y="150" width="260" height="240" rx="42" fill="url(#busGrad)" filter="url(#glow)" />

  <!-- Bus Windshield -->
  <rect x="156" y="180" width="200" height="90" rx="18" fill="url(#windowGrad)" />

  <!-- Front Grille & Destination Display -->
  <rect x="190" y="295" width="132" height="30" rx="8" fill="#0f172a" />
  <text x="256" y="316" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="3">BU SMART BUS</text>

  <!-- Headlights -->
  <circle cx="166" cy="340" r="18" fill="#fef08a" filter="url(#glow)" />
  <circle cx="166" cy="340" r="10" fill="#ffffff" />

  <circle cx="346" cy="340" r="18" fill="#fef08a" filter="url(#glow)" />
  <circle cx="346" cy="340" r="10" fill="#ffffff" />

  <!-- Tires -->
  <rect x="110" y="380" width="45" height="55" rx="12" fill="#020617" />
  <rect x="357" y="380" width="45" height="55" rx="12" fill="#020617" />

  <!-- BU Emblem text -->
  <text x="256" y="468" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="4">BARISHAL</text>
</svg>
